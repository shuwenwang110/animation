<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animation</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #000;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        display: block;
    }
</style>
</head>
<body>
<img src="animation.gif" alt="Pencil Animation">
</body>
</html>
